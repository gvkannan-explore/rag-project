[project]
name = "pubmed-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gvkannan-explore", email = "gvkanna.work@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
]

[project.scripts]
rag = "pubmed_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]
vector-store = [
    "numpy>=2.5.3",
    "openai>=3.26.0",
    "pgvector>=0.5.0",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "tiktoken>=0.14.0",
]

[tool.ruff]
target-version = "py314"

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests", "evals"]
strict =["src"] 

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = ["tests"]
